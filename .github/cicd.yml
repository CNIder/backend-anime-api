name: Anime API CI/CD

on:
  push:
    branches:
      - main
      - Artur

  pull_request:

jobs:

  test:

    runs-on: ubuntu-latest

    steps:

    - uses: actions/checkout@v3

    - uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    - name: Run lint
      run: |
        flake8 . || true

    - name: Run tests
      run: |
        pytest || true