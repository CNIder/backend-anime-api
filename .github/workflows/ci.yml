name: CI/CD-Pipeline-Antonio

on:
  push:
    branches: # Pesky accents :(
      - "feature/**"
      - "Antonio-Caldeira"
      - "António-Caldeira"
  pull_request:
    branches: # Pesky accents :(
      - "Antonio-Caldeira"
      - "António-Caldeira"
  workflow_dispatch:

jobs:
  local-tests:
    name: Run phase 7 local tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-test.txt
          python -m pip install -r phase_7/analytics/requirements.txt

      - name: Run local test script
        env:
          RECOMMENDATIONS_MODE: smoke
        run: bash scripts/run-local-tests.sh

  container-builds:
    name: Build representative container image
    runs-on: ubuntu-latest
    needs: local-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build analytics Docker image
        run: bash scripts/build-phase7-images.sh

  package-delivery-artifact:
    name: Package delivery artifact
    runs-on: ubuntu-latest
    needs: container-builds

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build analytics image for delivery bundle
        run: bash scripts/build-phase7-images.sh

      - name: Package delivery artifact
        run: bash scripts/package-phase8-delivery.sh

      - name: Upload delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: phase8-delivery-antonio
          path: phase8-delivery-antonio
          retention-days: 14